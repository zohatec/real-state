<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <clipPath id="clipDesktop"><rect x="80" y="72" width="1120" height="496" rx="8"/></clipPath>
    <style>
      .bg{fill:#17362a}
      .accent{fill:#b58a2c}
      .panel{fill:#f2ecdd}
      .title{font-family:Fraunces, sans-serif; font-weight:700; font-size:44px; fill:#fff}
      .sub{font-family:Inter, sans-serif; font-size:18px; fill:rgba(242,236,221,0.9)}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <!-- left column: text -->
  <g transform="translate(60,96)">
    <rect width="420" height="448" rx="12" fill="rgba(0,0,0,0.15)"/>
    <text x="32" y="72" class="title">ঠিকানা — Thikana Properties</text>
    <text x="32" y="120" class="sub">ঢাকার নির্বাচিত এলাকায় যাচাইকৃত ফ্ল্যাট ও ইউনিট</text>

    <rect x="32" y="160" width="120" height="36" rx="6" fill="#b58a2c"/>
    <text x="44" y="185" font-size="14" fill="#fff" font-family="Inter, sans-serif">ফ্ল্যাগশিপ দেখুন</text>

    <rect x="32" y="214" width="340" height="200" rx="8" fill="rgba(255,255,255,0.03)"/>
  </g>

  <!-- browser mockup on right -->
  <g transform="translate(520,72)">
    <rect width="640" height="496" rx="12" fill="#fff"/>
    <rect x="0" y="0" width="640" height="36" rx="12" fill="#efefef"/>
    <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="80" cy="18" r="6" fill="#27c93f"/>
    <g clip-path="url(#clipDesktop)">
      <image href="https://picsum.photos/seed/thikana-hero/1120/768" x="0" y="36" width="640" height="448" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="12" y="404" width="616" height="96" rx="8" fill="rgba(0,0,0,0.35)"/>
    <text x="28" y="450" font-family="Fraunces, serif" font-size="22" fill="#fff">গুলশান ক্রেসেন্ট — ৳ ৪.১৫ কোটি</text>
  </g>

  <!-- logo mark top-right -->
  <g transform="translate(56,24)">
    <rect width="56" height="56" rx="10" fill="#b58a2c"/>
    <path d="M10 34l18-16 18 16M14 32v18h28v-18" stroke="#f2ecdd" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
